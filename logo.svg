<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="currentColor" role="img" aria-label="Olyzon">
  <title>Olyzon</title>
  <!--
    PLACEHOLDER — approximate trace of the Olyzon brand icon.
    Replace with the official SVG export from BRAND-ICON/VECTOR-AI/RGB-DIGITAL/
    (or File → Export → SVG from Illustrator on the .ai source files,
    Document Color Mode = RGB) when available.

    Uses fill="currentColor" so a single file serves both:
      - light backgrounds — set color: #091217 (Deep Slate Gray)
      - dark backgrounds  — set color: #FFFFFF or #F8FAFC (neutral-050)
    No hard-coded hex inside the SVG.
  -->
